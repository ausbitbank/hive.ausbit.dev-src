# banksia.io — nginx virtual host (also serves the legacy hive.ausbit.dev)
#
# Install as /etc/nginx/sites-available/banksia.io and symlink from
# sites-enabled. The SSL lines below are managed by certbot; keep them when
# applying this file on the production host.
#
# The build publishes:
#   index.html, blocks.html, browse.html, ...   prerendered metadata shells
#   __meta.html                                 SSI shell for dynamic routes
#   assets/, statics/, sw.js, feed.xml, ...
#
# URL policy: no trailing slash. /path/ permanently redirects to /path and every
# sitemap <loc> is a final 200 URL. /block/N redirects to the canonical /b/N.

# ---- Real client IPs -----------------------------------------------------
# Without this, access_log records the Cloudflare edge IP for every request,
# which makes unique visitors, sessions and per-IP analysis impossible. The
# include also sets real_ip_header/real_ip_recursive.
include /etc/nginx/cloudflare-realip.conf;

# ---- Analytics logging ---------------------------------------------------
# Classify at log time so bot traffic can be filtered without re-deriving UA
# rules later. See docs/analytics-review.md for why these three matter.
map $http_user_agent $hive_client_class {
  default                                  "browser-ua";
  ""                                       "none";
  "~*X11; Linux x86_64.*Chrome/155\."      "bot-linux155";
  "~*Macintosh.*Chrome/146\."              "bot-beacon";
  "~*(Reflectionbot|ElevenlabsCrawler)"    "bot-ai-crawler";
  "~*(bot|crawler|spider|headlesschrome)"  "bot-other";
}

log_format hive_analytics escape=json
  '{"ts":"$time_iso8601"'
  ',"ip":"$remote_addr"'
  ',"cf_ip":"$http_cf_connecting_ip"'
  ',"class":"$hive_client_class"'
  ',"host":"$host"'
  ',"method":"$request_method"'
  ',"uri":"$request_uri"'
  ',"status":$status'
  ',"bytes":$body_bytes_sent'
  ',"rt":$request_time'
  ',"proto":"$server_protocol"'
  ',"ref":"$http_referer"'
  ',"ua":"$http_user_agent"}';

# Friendly names for the dynamic sort routes.
map $sort $sort_label {
  default         "Hive";
  trending        "Trending";
  created         "New";
  hot             "Hot";
  payout          "Payout";
  payout_comments "Payout comments";
  muted           "Muted";
}

# Friendly names for the microblog (short-form) format routes.
map $format $format_label {
  default  "Short posts";
  snaps    "Snaps";
  waves    "Waves";
  threads  "Threads";
  dbuzz    "D.Buzz";
  moments  "Moments";
}

# ---- Cache policy -------------------------------------------------------
# HTML shells are the version pointer for the SPA: they must revalidate or a
# deploy can be pinned in a browser (or at the edge) and keep pointing at
# bundles that no longer exist. Only content-hashed build output is immutable.
# scripts/deploy.sh retains old /assets/ files for KEEP_DAYS so a tab opened
# before a deploy can still load its lazy chunks.
map $uri $hive_cache_control {
  default               "no-cache";
  "~^/assets/"          "public, max-age=31536000, immutable";
  "~^/statics/"         "public, max-age=604800";
  "/home-snapshot.json" "public, max-age=300";
}

# A first-level *.banksia.io host is an account blog. The SPA route table is
# selected by the same rule in the browser, so the origin only needs to decide
# whether an unknown path should fall back to the app shell or return 404.
# `files.banksia.io` has its own vhost, which wins over this wildcard.
map $host $hive_blog_host {
  default 0;
  "~^(?!www\.)[a-z0-9-]+\.banksia\.io$" 1;
}

# A blog host uses the plain SPA shell for /about; the apex serves its
# prerendered about page. Other apex-only exact locations are not linked from
# the blog surface, so they keep their normal behaviour.
map $hive_blog_host $hive_about_shell {
  default /about.html;
  1       /index.html;
}

server {
    server_name banksia.io www.banksia.io hive.ausbit.dev *.banksia.io;
    root /var/www/banksia.io;
    index index.html;
    server_tokens off;

    # Never serve dotfiles. ACME/well-known handlers stay reachable elsewhere.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Webroot ACME challenges are served over both schemes, so Cloudflare's
    # "Always Use HTTPS" redirect cannot break certificate validation.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/banksia.io;
    }

    # JSON log for traffic analysis. Keep the default log too if other tooling
    # reads it; this one is additive.
    access_log /var/log/nginx/banksia.io.access.log hive_analytics;

    # Efficient static-file delivery.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json application/xml image/svg+xml;

    # One canonical host. The legacy host stays functional; www is only an
    # alias for the apex and permanently redirects to it.
    if ($host = www.banksia.io) {
        return 301 https://banksia.io$request_uri;
    }

    # One trailing-slash policy: strip it once, keeping the query string.
    if ($request_uri ~ "^(.+?)/+(\?.*)?$") {
        return 301 $1$2;
    }

    # Security headers. Keep this list in sync with docs/SECURITY.md. `always`
    # also applies them to redirects and 4xx responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://s3.tradingview.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' https: blob:; connect-src 'self' https: wss: https://cloudflareinsights.com https://*.tradingview.com; manifest-src 'self'; worker-src 'self' blob:; frame-src https://youtube.com https://www.youtube.com https://www.youtube-nocookie.com https://youtu.be https://player.vimeo.com https://vimeo.com https://3speak.tv https://www.3speak.tv https://play.3speak.tv https://odysee.com https://rumble.com https://www.bitchute.com https://d.tube https://ipfs.io https://gateway.ipfs.io https://open.spotify.com https://w.soundcloud.com https://platform.twitter.com https://player.twitch.tv https://s.tradingview.com https://www.tradingview.com; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; report-uri /csp-report; report-to csp-endpoint" always;
    add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://banksia.io/csp-report"}]}' always;
    add_header Reporting-Endpoints 'csp-endpoint="https://banksia.io/csp-report"' always;
    # The policy comes from the map above. Locations below must not declare
    # their own add_header or nginx drops this whole inherited set.
    add_header Cache-Control $hive_cache_control always;

    # A real 404 status, but rendered by the SPA so the Not Found page still
    # appears. The named location forces the status back to 404 while serving
    # the SSI shell with a /404 canonical.
    error_page 404 =404 @spa404;

    # The manifest needs an explicit type: Debian's mime.types does not map
    # .webmanifest, so the default would be application/octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Static entry points.
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /sw.js {
        # The browser must revalidate the service worker so updates roll out.
        # Service workers are no-cache by default in the map above.
        try_files $uri =404;
    }
    location = /offline.html {
        try_files $uri =404;
    }
    # Pre-warmed home data for client-side navigation and non-home shells.
    # Short-lived so a deploy is picked up quickly; the app refreshes live
    # anyway and only uses this for the first paint.
    location = /home-snapshot.json {
        try_files $uri =404;
    }
    # Implementation detail: never expose the raw SSI template.
    location = /__meta.html {
        return 404;
    }

    # Canonical aliases. These redirects keep one URL shape for crawlers and
    # match the canonical tags emitted by the app.
    location ~ "^/block/(?<blocknum>[0-9]+)$" {
        return 301 /b/$blocknum$is_args$args;
    }
    location = /dao {
        return 301 /proposals$is_args$args;
    }
    location = /drafts {
        return 301 /compose$is_args$args;
    }
    # /browse and /created render the same "new posts" page. Keep one URL.
    location = /browse {
        return 301 /created$is_args$args;
    }
    # /c is the short alias for the public community directory.
    location ~ "^/c/?$" {
        return 301 /communities$is_args$args;
    }

    # The search page is a client-side surface. It has no prerendered metadata
    # shell, so serve the shell with a real 200 instead of the 404 fallback.
    # The prerendered search.html carries a robots noindex tag.
    location ^~ /search {
        try_files /search.html /index.html =404;
    }

    # Theme surfaces. These are client-side routes without prerendered shells,
    # so give them the shared metadata shell instead of the unknown-route 404.
    location = /appearance {
        set $page_title "Appearance — themes and profile skins — banksia.io";
        set $page_description "Choose a site theme, follow your system appearance, and control profile skins and motion on banksia.io.";
        set $page_path "/appearance";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /themes {
        set $page_title "Theme Wall — looks from the Hive";
        set $page_description "Built-in Hive themes and profile skins published by accounts you follow on banksia.io.";
        set $page_path "/themes";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    # About page. Prerendered static content; no SSI needed. A blog host gets
    # the plain SPA shell instead so /about renders the blog's own page.
    location = /about {
        try_files $hive_about_shell $uri.html /index.html =404;
    }

    location = /blogs {
        set $page_title "Free Hive blogs — banksia.io";
        set $page_description "Every Hive account has a clean reading page at username.banksia.io. All your posts, three themes, RSS and link previews. Claim it free.";
        set $page_path "/blogs";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /blogs/directory {
        set $page_title "Blog directory — banksia.io";
        set $page_description "Opt-in Hive blogs on banksia.io. Browse community, project and personal blogs at username.banksia.io.";
        set $page_path "/blogs/directory";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /pay {
        set $page_title "Pay for a Hive product — banksia.io";
        set $page_description "Review a Hive Open Market product and queue a direct Hive payment.";
        set $page_path "/pay";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /cart {
        set $page_title "Cart — banksia.io";
        set $page_description "Review Hive Open Market products before checkout.";
        set $page_path "/cart";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /checkout {
        set $page_title "Checkout — banksia.io";
        set $page_description "Review Hive Open Market products and queue direct Hive payments.";
        set $page_path "/checkout";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /orders {
        set $page_title "Orders — banksia.io";
        set $page_description "Hive Open Market purchases and sales from public account history.";
        set $page_path "/orders";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /subscribe {
        set $page_title "Subscribe to a Hive blog — banksia.io";
        set $page_description "Join a Hive blog with a native HBD recurring transfer. The creator is paid directly and Banksia never holds your keys.";
        set $page_path "/subscribe";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /subscriptions {
        set $page_title "Subscriptions — banksia.io";
        set $page_description "Manage Hive blog memberships, recurring HBD payments and local reader keys.";
        set $page_path "/subscriptions";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /settings/blog/vault {
        set $page_title "Vault dashboard — banksia.io";
        set $page_description "Issue members-only grants, manage subscriber keys and export Vault revenue.";
        set $page_path "/settings/blog/vault";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /settings/moderation {
        set $page_title "Moderation — local policy and list context — banksia.io";
        set $page_description "Choose how banksia.io labels, collapses or hides content. Local-first presets, mute and blacklist layers, skin safety and versioned export/import.";
        set $page_path "/settings/moderation";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /settings/blog {
        set $page_title "Blog settings — banksia.io";
        set $page_description "Claim a free Hive blog at yourname.banksia.io and choose its theme, title and content.";
        set $page_path "/settings/blog";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    # A docroot directory whose name is also a route makes nginx answer
    # /x with 301 /x/, which the trailing-slash rule above sends straight back.
    # Every such directory needs an explicit file-serving location. /settings
    # has no page of its own, so show the app's Not Found page instead of
    # looping.
    location = /settings {
        return 404;
    }

    location = /settings/skin {
        set $page_title "Skin Studio — design your Hive profile skin";
        set $page_description "Design a palette, backdrop, type, avatar frame and ticker for your Hive profile, then publish it with posting authority.";
        set $page_path "/settings/skin";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }
    location ~ "^/@(?<acct>[a-z0-9.-]+)/transfers$" {
        return 301 /@$acct/wallet$is_args$args;
    }
    location ~ "^/account/@(?<acct>[a-z0-9.-]+)$" {
        return 301 /@$acct$is_args$args;
    }

    # ---- Dynamic metadata (SSI) -------------------------------------------
    # Values interpolated into __meta.html are restricted to URL-safe account,
    # permlink, tag, token and hash characters by the location regexes.

    location ~ "^/@(?<acct>[a-z0-9.-]+)/delegations$" {
        set $page_title "@$acct delegations — Hive Power in and out";
        set $page_description "Incoming and outgoing Hive Power delegations for @$acct, with effective HP and recent delegation changes.";
        set $page_path "/@$acct/delegations";
        set $page_image "https://images.hive.blog/u/$acct/avatar";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/@(?<acct>[a-z0-9.-]+)/wallet/(?<token>[a-z0-9._-]+)$" {
        set $page_title "@$acct's $token wallet";
        set $page_description "@$acct's $token wallet on banksia.io — balances, history and transfers.";
        set $page_path "/@$acct/wallet/$token";
        set $page_image "https://images.hive.blog/u/$acct/avatar";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    # The shop (including /shop/<permlink> and /shop/@author/<permlink>) is a
    # blog-host surface. The edge Worker rewrites its head metadata; the origin
    # only needs to serve the SPA shell, and must not invent an apex shop.
    location ~ "^/shop(?:/.*)?$" {
        if ($hive_blog_host = 1) {
            rewrite ^ /index.html last;
        }
        return 404;
    }

    location ~ "^/@(?<acct>[a-z0-9.-]+)/(?<page>wallet|lightning|pos|followers|following|posts|blog|feed|replies|comments|communities|downvotes|tip|trail)$" {
        set $page_title "@$acct's $page — banksia.io";
        set $page_description "Hive account @$acct: $page on banksia.io.";
        set $page_path "/@$acct/$page";
        set $page_image "https://images.hive.blog/u/$acct/avatar";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/@(?<acct>[a-z0-9.-]+)$" {
        # A blog host has no explorer account page. Serve the blog shell so the
        # client router can show its own not-found page instead of an apex
        # account shell with the wrong canonical.
        if ($hive_blog_host = 1) {
            rewrite ^ /index.html last;
        }
        set $page_title "@$acct — Hive account";
        set $page_description "Hive account @$acct on banksia.io — reputation, posts, wallet, followers and on-chain activity.";
        set $page_path "/@$acct";
        set $page_image "https://images.hive.blog/u/$acct/avatar";
        set $page_type "profile";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/@(?<acct>[a-z0-9.-]+)/(?<permlink>[a-z0-9][a-z0-9._-]*)$" {
        # Contributor posts on a blog host use /@author/permlink. They are a
        # blog route, not an explorer post page.
        if ($hive_blog_host = 1) {
            rewrite ^ /index.html last;
        }
        set $page_title "@$acct: $permlink — Hive post";
        set $page_description "Hive post by @$acct: $permlink. Read the discussion and votes on banksia.io.";
        set $page_path "/@$acct/$permlink";
        set $page_image "https://images.hive.blog/u/$acct/avatar";
        set $page_type "article";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/(?<tag>[a-z0-9-]+)/@(?<acct>[a-z0-9.-]+)/(?<permlink>[a-z0-9][a-z0-9._-]*)$" {
        set $page_title "@$acct: $permlink — Hive post";
        set $page_description "Hive post by @$acct in #$tag: $permlink. Read the discussion and votes on banksia.io.";
        set $page_path "/$tag/@$acct/$permlink";
        set $page_image "https://images.hive.blog/u/$acct/avatar";
        set $page_type "article";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/b/(?<blocknum>[0-9]+)$" {
        set $page_title "Hive block $blocknum";
        set $page_description "Hive block $blocknum on banksia.io — transactions, operations, virtual operations, witness and raw block JSON.";
        set $page_path "/b/$blocknum";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/tx/(?<txid>[0-9a-fA-F]+)$" {
        set $page_title "Hive transaction $txid";
        set $page_description "Hive transaction $txid on banksia.io — operations, block and raw transaction JSON.";
        set $page_path "/tx/$txid";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/proposals/(?<proposal>[0-9]+)$" {
        set $page_title "Hive proposal $proposal";
        set $page_description "Decentralized Hive Fund proposal $proposal — funding, votes and status on banksia.io.";
        set $page_path "/proposals/$proposal";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/token/(?<token>[a-z0-9._-]+)$" {
        set $page_title "$token — Hive-Engine token";
        set $page_description "$token Hive-Engine token on banksia.io — market, balances and transfers.";
        set $page_path "/token/$token";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/c/(?<community>[a-z0-9-]+)/(?<sort>[a-z_]+)$" {
        set $page_title "$community — Hive community";
        set $page_description "Hive community $community on banksia.io — $sort posts and discussion.";
        set $page_path "/c/$community/$sort";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/c/(?<community>[a-z0-9-]+)$" {
        set $page_title "$community — Hive community";
        set $page_description "Hive community $community on banksia.io — posts, discussion and subscribers.";
        set $page_path "/c/$community";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/(?<sort>trending|created|hot|payout|payout_comments|muted)/(?<tag>[a-z0-9-]+)$" {
        set $page_title "$sort_label Hive posts in #$tag";
        set $page_description "$sort_label Hive posts tagged #$tag on banksia.io.";
        set $page_path "/$sort/$tag";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/(?<sort>trending|created|hot|payout|payout_comments|muted)$" {
        set $page_title "$sort_label Hive posts";
        set $page_description "$sort_label posts from the Hive blockchain on banksia.io.";
        set $page_path "/$sort";
        set $page_type "website";
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/browse/(?<sort2>[a-z_]+)/(?<tag2>[a-z0-9-]+)$" {
        set $page_title "$sort2 Hive posts in #$tag2";
        set $page_description "$sort2 Hive posts tagged #$tag2 on banksia.io.";
        set $page_path "/browse/$sort2/$tag2";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/browse/(?<sort2>[a-z_]+)$" {
        set $page_title "$sort2 Hive posts";
        set $page_description "$sort2 posts from the Hive blockchain on banksia.io.";
        set $page_path "/browse/$sort2";
        set $page_type "website";
        try_files /__meta.html /index.html;
        ssi on;
    }

    # ---- Microblog (short-form) routes ------------------------------------
    # /shorts and each format page are prerendered (scripts/prerender.mjs) and
    # serve their own metadata shell. Only the five known formats are matched,
    # so any other /shorts/* path still returns a real 404. Post pages below
    # fall back to the shared SSI shell, like other dynamic routes.
    location ~ "^/shorts(?:/(?<format>snaps|waves|threads|dbuzz|moments))?$" {
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location ~ "^/shorts/(?<format>snaps|waves|threads|dbuzz|moments)/@(?<acct>[a-z0-9.-]+)/(?<permlink>[a-z0-9][a-z0-9._-]*)$" {
        set $page_title "@$acct on $format_label — Hive microblog";
        set $page_description "$format_label post by @$acct on banksia.io. Read the replies and discussion.";
        set $page_path "/shorts/$format/@$acct/$permlink";
        set $page_type "article";
        try_files /__meta.html /index.html;
        ssi on;
    }

    # ---- Prerendered static pages -----------------------------------------
    # Keep this list in sync with PRERENDER_ROUTES: a route whose prerendered
    # shell creates a docroot directory (join/, create/, shorts/, …) must have a
    # location here, or nginx redirects /path to /path/ and the no-trailing-slash
    # rule redirects it back.
    location ~ "^/(blocks|witnesses|witness|proposals|hbd|market|markets|health|nodes|magi|join|create|hbdstabilizer|compose|communities|lightning)$" {
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    # Claim/key generation pages have their own prerendered shells. The claim
    # page is noindex; the keys page is a normal public signup surface.
    location = /join/keys {
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /join/hivedex {
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /create/claim {
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    location = /create/batch {
        try_files $uri.html /__meta.html /index.html;
        ssi on;
    }

    # ---- Asset and static-file fallbacks ----------------------------------
    # Content-hashed build output never changes, so it is immutable for a year
    # (see the cache map at the top). The deploy script keeps the previous
    # builds' files around for KEEP_DAYS so open tabs can still fetch them.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Fonts, icons and static images change infrequently. A week avoids a
    # revalidation round-trip on repeat visits without pinning an old icon
    # font for a year.
    location ^~ /statics/ {
        try_files $uri =404;
    }

    # Preserve a real 404 for missing files instead of returning the SPA shell.
    location ~* "\.(?:js|mjs|css|map|json|txt|xml|webmanifest|png|jpe?g|webp|gif|svg|ico|woff2?|ttf|eot|mp4|webm|pdf)$" {
        try_files $uri =404;
    }

    location @spa404 {
        set $page_title "Page not found (404) — banksia.io";
        set $page_description "The requested page could not be found. Search accounts, posts, tags, blocks and transactions on banksia.io.";
        set $page_path "/404";
        set $page_type "website";
        try_files /404.html /__meta.html /index.html =500;
        ssi on;
    }

    # Unknown routes: 404 status + the SPA shell, so the client router can
    # render the Not Found page without advertising the homepage canonical.
    # Blog hosts are the exception: their whole route table is client-side, so
    # /<permlink>, /about and /contact all fall back to the app shell.
    location / {
        try_files $uri @spa_fallback;
    }

    location @spa_fallback {
        if ($hive_blog_host = 0) {
            return 404;
        }
        try_files /index.html =500;
    }

    # Issued with:
    #   certbot certonly --webroot -w /var/www/banksia.io \
    #     -d banksia.io -d www.banksia.io -d hive.ausbit.dev --cert-name banksia.io
    #
    # Blog hosts (*.banksia.io) need a wildcard origin certificate. Cloudflare's
    # Universal SSL already covers first-level subdomains at the edge; the origin
    # must present a matching certificate too. Install a Cloudflare Origin CA
    # certificate for *.banksia.io (or expand the certbot certificate with a
    # DNS-01 challenge) before enabling blog hosts in production.
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/banksia.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/banksia.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name banksia.io www.banksia.io hive.ausbit.dev *.banksia.io;

    # Keep ACME HTTP-01 reachable; everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/banksia.io;
    }

    location / {
        if ($host = www.banksia.io) {
            return 301 https://banksia.io$request_uri;
        }
        return 301 https://$host$request_uri;
    }
}
