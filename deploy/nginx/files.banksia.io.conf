# files.banksia.io — static asset host for devlog and blog screenshots.
#
# The docroot mirrors the repository path, so every asset keeps its repo
# location and a URL is simply the repo path with a different origin:
#
#   docs/screenshots/devlog/2026-11-27-devlog/02-about.png
#   https://files.banksia.io/docs/screenshots/devlog/2026-11-27-devlog/02-about.png
#
# That lets the devlog tooling swap RAW_BASE for this origin without reshaping
# paths, and the original GitHub copies keep working while the move settles.
#
# Issued with:
#   certbot certonly --webroot -w /var/www/files.banksia.io \
#     -d files.banksia.io --cert-name files.banksia.io
#
# Install as /etc/nginx/sites-available/files.banksia.io and symlink from
# sites-enabled. The SSL lines below are managed by certbot; keep them when
# applying this file on the production host.
#
# Order matters on a fresh host: serve the docroot over port 80 first (certbot
# needs /.well-known/acme-challenge/ reachable), issue the certificate, then
# install this file. Applying it before the certificate exists fails `nginx -t`.

# Dated devlog directories are immutable once published: cache them for a year
# and skip revalidation. Everything else gets a week. Misses are never cached,
# so a fixed typo starts working immediately instead of sticking in caches.
map "$uri:$status" $files_cache_control {
    default                       "public, max-age=604800";
    "~:404$"                      "no-store";
    "~^/docs/screenshots/devlog/" "public, max-age=31536000, immutable";
}

server {
    listen 443 ssl http2;
    server_name files.banksia.io;

    root /var/www/files.banksia.io;
    autoindex off;
    server_tokens off;

    include /etc/nginx/cloudflare-realip.conf;

    access_log /var/log/nginx/files.banksia.io.access.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Read-only host: no uploads, no methods with side effects.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The images are embedded by banksia.io posts and by Hive front ends, so
    # allow cross-origin reads rather than restricting them to same-origin.
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    # `always` also applies this to 404s; a missing image should not be cached
    # for a year by an intermediary.
    add_header Cache-Control $files_cache_control always;

    location / {
        try_files $uri =404;
    }

    # No dotfiles, no directory indexes, no path traversal into the repo tree.
    location ~ /\. {
        deny all;
    }

    ssl_certificate /etc/letsencrypt/live/files.banksia.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.banksia.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name files.banksia.io;

    root /var/www/files.banksia.io;

    # Keep ACME HTTP-01 reachable; everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
