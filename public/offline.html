<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — hive.ausbit.dev</title>
    <style>
      :root { color-scheme: dark; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: #0d1114;
        color: #cfd8dc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 520px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.025);
        text-align: center;
      }
      h1 { margin: 0 0 10px; color: #e4eaed; font-size: 26px; }
      p { margin: 0 0 18px; color: #90a4ae; line-height: 1.55; }
      a {
        display: inline-block;
        margin: 4px;
        padding: 9px 14px;
        border-radius: 6px;
        background: #4fc3f7;
        color: #0b1d2a;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The explorer shell is cached, but live chain data needs a connection. Reconnect and try again.</p>
      <a href="/">Retry</a>
      <a href="/browse">Browse posts</a>
    </main>
  </body>
</html>
